# Agent IA Claude : mentionnez @claude dans une issue, un commentaire
# ou une revue de PR pour qu'il modifie les fichiers du dépôt.
name: Agent Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Lancer l'agent Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Clé API Anthropic (Settings > Secrets and variables > Actions)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ou, avec un abonnement Claude Pro/Max (via `claude setup-token`) :
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
